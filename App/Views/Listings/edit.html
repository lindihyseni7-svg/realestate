{% extends "layout/appLayout.html" %}

{% block title %}Edit Listing{% endblock %}

{% block content %}
<main>
    <div class="container-fluid">
        <h1 class="mt-4">Edit Listing</h1>
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="card shadow-lg border-0 rounded-lg mt-5">
                    <div class="card-header">
                        <h3 class="text-center font-weight-light my-2">Edit Listing</h3>
                    </div>

                    <div class="card-body">
                        <form method="post" action="/realestate/public/listings-update" enctype="multipart/form-data">
                            <input type="hidden" name="id" value="{{ listing.id }}">
                            <div class="form-group">
                                <label class="small mb-1">Address :</label>
                                <input class="form-control py-4" name="address" type="text" value="{{ listing.address }}" placeholder="Enter address"/>
                            </div>
                            <div class="form-group">
                                <label class="small mb-1">Price :</label>
                                <input class="form-control py-4" name="price" value="{{ listing.price }}" type="text" placeholder="Enter price"/>
                            </div>
                            <div class="form-group">
                                <label class="small mb-1">Bedrooms :</label>
                                <input class="form-control py-4" name="bedrooms" value="{{ listing.bedrooms }}" type="number" placeholder="Enter number of bedrooms"/>
                            </div>
                            <div class="form-group">
                                <label class="small mb-1">Bathrooms :</label>
                                <input class="form-control py-4" name="bathrooms" value="{{ listing.bathrooms }}" type="number" placeholder="Enter number of bathrooms"/>
                            </div>
                            <div class="form-group">
                                <label class="small mb-1">Description :</label>
                                <textarea class="form-control py-4" name="description" placeholder="Enter description">{{ listing.description }}</textarea>
                            </div>
                            <div class="form-group">
                                <label class="small mb-1" for="agent">Agent</label>
                                <select class="form-control" name="agent_id" id="agent" required>
                                    <option value="">Select agent</option>
                                    {% for agent in agents %}
                                    <option value="{{ agent.id }}" {% if agent.id == listing.agent_id %} selected {% endif %}>{{ agent.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="small mb-1" for="property_type">Property Type</label>
                                <select class="form-control" name="type_id" id="property_type" required>
                                    <option value="">Select property type</option>
                                    {% for property_type in property_types %}
                                    <option value="{{ property_type.id }}" {% if property_type.id == listing.type_id %} selected {% endif %}>{{ property_type.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <input class="btn btn-primary" value="Edit" type="submit"/>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
