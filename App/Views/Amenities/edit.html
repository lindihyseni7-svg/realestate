{% extends "layout/appLayout.html" %}

{% block title %}Edit Amenity{% endblock %}

{% block content %}
<main>
    <div class="container-fluid">
        <h1 class="mt-4">Edit Amenity</h1>
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="card shadow-lg border-0 rounded-lg mt-5">
                    <div class="card-header">
                        <h3 class="text-center font-weight-light my-2">Edit Amenity</h3>
                    </div>

                    <div class="card-body">
                        <form method="post" action="{{ url('amenities-update') }}">
                            <input type="hidden" name="id" value="{{ amenity.id }}">
                            <div class="form-group">
                                <label class="small mb-1">Name :</label>
                                <input class="form-control py-4" name="name" type="text" value="{{ amenity.name }}" placeholder="Enter name" required/>
                            </div>
                            <input class="btn btn-primary" value="Edit Amenity" type="submit"/>
                        </form>
                    </div>
                </div>
            </div>
        </div>
</main>
{% endblock %}
