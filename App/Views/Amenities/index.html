{% extends "layout/appLayout.html" %}

{% block title %}Amenities{% endblock %}

{% block content %}
<main>
    <div class="container-fluid">
        <h1 class="mt-4">Amenities</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item active">Amenities</li>
        </ol>

        <div class="row">
            <div class="col-12">
                <div class="table-responsive">
                    <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Created at</th>
                            <th>Updated at</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                        </thead>
                        <tbody>
                        {% for amenity in amenities %}
                        <tr>
                            <td>{{ amenity.name }}</td>
                            <td>{{ amenity.created_at }}</td>
                            <td>{{ amenity.updated_at }}</td>
                            <td><a href="{{ url('amenities-edit') }}?id={{ amenity.id }}">Edit</a></td>
                            <td>
                                <form method="post" action="{{ url('amenities-delete') }}" onsubmit="return confirmSubmit();">
                                    <input type="hidden" name="id" value="{{ amenity.id }}">
                                    <input type="submit" value="Delete">
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
<script>
    function confirmSubmit() {
        return confirm("Are you sure you want to delete this amenity?");
    }
</script>
{% endblock %}
